version: "2"
sql:
  - engine: "sqlite"
    queries: "./db/queries/queries.sql"
    schema: "./db/migrations"
    gen:
      go:
        package: "db"
        out: "./db"
        overrides:
          - column: articles.published
            go_type:
              type: time.Time
              pointer: true
          - column: articles.date_found
            go_type:
              type: time.Time
              pointer: true
